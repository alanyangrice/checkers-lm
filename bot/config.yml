# lidraughts-bot config for the Draughts-QUEEN engine (copy to lidraughts-bot/config.yml).
# Fill in the token (bot:play scope). See bot/dq_engine.py for setup.
token: "xxxxxxxxxxxxxxxx"
url: "https://lidraughts.org/"

engine:
  dir: "./"
  name: "DQEngine"           # class name in strategies.py (from dq_engine import DQEngine)
  working_dir: "./"
  protocol: "homemade"
  ponder: false
  draw_or_resign:
    resign_enabled: false
    offer_draw_enabled: false
  homemade_options:
  silence_stderr: false

abort_time: 20
fake_think_time: false
rate_limiting_delay: 0
move_overhead: 2000
move_overhead_inc: 100

correspondence:
  move_time: 60
  checkin_period: 600
  disconnect_time: 300
  ponder: false

challenge:
  concurrency: 1
  sort_by: "best"
  accept_bot: true
  only_bot: false
  max_increment: 180
  min_increment: 0
  max_base: 315360000
  min_base: 0
  variants:
    - brazilian
  time_controls:
    - blitz
    - rapid
    - classical
    - correspondence
  modes:
    - casual
    - rated
