[project]
name = "draughts-queen"
version = "0.0.1"
description = "An LM that plays Brazilian draughts and explains its moves (QUEEN recipe)"
requires-python = ">=3.11"
dependencies = [
    "pydraughts>=0.6",
    "numpy>=1.26",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
